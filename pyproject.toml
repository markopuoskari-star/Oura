[project]
name = "oura-mcp"
version = "0.1.0"
description = "Paikallinen MCP-palvelin Oura Ring -datalle (OAuth2, DuckDB-välimuisti)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "duckdb>=1.0",
    "pandas>=2.1",
    "keyring>=25",
    "python-dotenv>=1.0",
    "pytz",
]

[project.scripts]
oura-mcp = "oura_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
